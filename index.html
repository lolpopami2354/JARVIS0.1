<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // STARK INDUSTRIES</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --blue: #0055ff;
            --dark: #050505;
            --grid: rgba(0, 243, 255, 0.05);
            --orange: #ffaa00;
            --red: #ff3333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--dark);
            background-image: 
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Boot Screen ── */
        #boot {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
        #boot.hidden { display: none; }
        #boot h1 { font-size: 2.5rem; text-shadow: 0 0 20px var(--cyan); margin-bottom: 15px; letter-spacing: 5px; }
        #boot p { font-family: 'Share Tech Mono', monospace; color: #666; margin-bottom: 25px; font-size: 0.85rem; text-align: center; max-width: 400px;}
        .input { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 14px 20px; font-family: 'Share Tech Mono', monospace; font-size: 1rem; width: 380px; text-align: center; outline: none; margin-bottom: 15px; }
        .btn { background: var(--cyan); color: #000; border: none; padding: 14px 50px; font-family: 'Orbitron'; font-weight: bold; font-size: 1rem; cursor: pointer; clip-path: polygon(10% 0,100% 0,90% 100%,0 100%); transition: 0.3s; letter-spacing: 2px; }
        .btn:hover { background: #fff; box-shadow: 0 0 30px var(--cyan); }

        /* ── Main HUD ── */
        .hud-top { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 0.7rem; letter-spacing: 4px; opacity: 0.6; }
        
        .arc-wrap { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .arc { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--cyan) 30%, transparent 70%); box-shadow: 0 0 60px var(--cyan), 0 0 120px var(--blue); transition: all 0.3s; }
        .ring { position: absolute; border: 2px solid var(--cyan); border-radius: 50%; opacity: 0.25; }
        .r1 { width: 210px; height: 210px; animation: spin 8s linear infinite; border-style: dashed; }
        .r2 { width: 270px; height: 270px; animation: spinr 12s linear infinite; }
        
        .arc.idle { background: radial-gradient(circle, #fff 0%, var(--cyan) 30%, transparent 70%); box-shadow: 0 0 60px var(--cyan); animation: pulse 4s infinite alternate; }
        .arc.speaking { background: radial-gradient(circle, #fff 0%, var(--cyan) 30%, transparent 70%); box-shadow: 0 0 100px var(--cyan); transform: scale(1.15); animation: pulse-fast 0.5s infinite alternate; }
        .arc.error { background: radial-gradient(circle, #fff 0%, var(--red) 30%, transparent 70%); box-shadow: 0 0 60px var(--red); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spinr { to { transform: rotate(-360deg); } }
        @keyframes pulse { from { transform: scale(0.95); opacity: 0.8; } to { transform: scale(1.05); opacity: 1; } }
        @keyframes pulse-fast { from { transform: scale(1.1); } to { transform: scale(1.25); } }

        #status { position: absolute; bottom: 250px; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; }

        /* ── Log Panel ── */
        #log {
            position: absolute; bottom: 15px; width: 85%; max-width: 900px; height: 200px;
            background: rgba(0,15,30,0.8); border: 1px solid rgba(0,243,255,0.3); border-radius: 8px;
            padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem;
            overflow-y: auto; line-height: 1.5;
        }
        .l-sys { color: var(--orange); }
        .l-err { color: var(--red); font-weight: bold; }
        .l-ok { color: #00ff88; }
        .l-user { color: #fff; }
        .l-ai { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }

        /* ── Settings ── */
        #settings-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; transition: 0.3s; z-index: 100; }
        #settings-btn:hover { background: var(--cyan); color: #000; transform: rotate(90deg); }
        
        #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 5000; backdrop-filter: blur(8px); }
        #settings-modal.hidden { display: none; }
        .s-panel { background: rgba(5,15,30,0.98); border: 1px solid var(--cyan); padding: 35px; width: 420px; clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%); }
        .s-panel h2 { margin-bottom: 20px; border-bottom: 1px solid var(--cyan); padding-bottom: 10px; font-size: 1rem; letter-spacing: 3px; }
        .s-group { margin-bottom: 18px; }
        .s-group label { display: block; font-family: 'Share Tech Mono'; font-size: 0.7rem; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 2px; }
        .s-group input, .s-group select { width: 100%; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.3); color: var(--cyan); padding: 10px; font-family: 'Share Tech Mono'; font-size: 0.9rem; outline: none; }
        .s-group select option { background: #050505; }
        .s-actions { display: flex; gap: 12px; margin-top: 25px; }
        .s-btn { flex: 1; padding: 12px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; font-size: 0.8rem; }
        .s-save { background: var(--cyan); color: #000; }
        .s-cancel { background: transparent; border: 1px solid var(--red); color: var(--red); }
    </style>
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot">
    <h1>J.A.R.V.I.S.</h1>
    <p>ENTER GEMINI API KEY AND CLICK INITIALIZE TO ENABLE AUDIO SYSTEMS</p>
    <input type="password" class="input" id="api-input" placeholder="API KEY">
    <button class="btn" id="boot-btn">⚡ INITIALIZE</button>
</div>

<!-- MAIN HUD -->
<div class="hud-top">STARK INDUSTRIES // MARK L WEB PROTOCOL</div>
<button id="settings-btn" onclick="openSettings()">⚙️</button>

<div class="arc-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div id="arc" class="arc idle"></div>
</div>
<div id="status">AWAITING COMMAND</div>
<div id="log"></div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="hidden">
    <div class="s-panel">
        <h2>SYSTEM CONFIGURATION</h2>
        <div class="s-group"><label>Gemini API Key</label><input type="password" id="s-key"></div>
        <div class="s-group"><label>Voice Core</label>
            <select id="s-voice">
                <option value="Charon">Charon (Deep / Formal)</option>
                <option value="Aoede">Aoede (Warm / Conversational)</option>
                <option value="Puck">Puck (Bright / Energetic)</option>
                <option value="Kore">Kore (Firm / Authoritative)</option>
                <option value="Fenrir">Fenrir (Gruff / Tactical)</option>
            </select>
        </div>
        <div class="s-actions">
            <button class="s-btn s-save" onclick="saveSettings()">SAVE & RECONNECT</button>
            <button class="s-btn s-cancel" onclick="closeSettings()">CANCEL</button>
        </div>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════════════════════════
    // J.A.R.V.I.S. WEB CORE 
    // ═══════════════════════════════════════════════════════════════

    const WS_URL = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";
    const MODEL = "models/gemini-2.5-flash-native-audio-preview-12-2025"; // Exact match from your Python code

    let ws = null;
    let micCtx = null, playCtx = null;
    let micStream = null, micProcessor = null;
    let isPlaying = false;
    let nextStartTime = 0;
    let speakingTimeout = null;

    const arc = document.getElementById('arc');
    const status = document.getElementById('status');
    const logEl = document.getElementById('log');

    function log(msg, type = 'sys') {
        const d = document.createElement('div');
        d.className = `l-${type}`;
        d.textContent = `> ${msg}`;
        logEl.appendChild(d);
        logEl.scrollTop = logEl.scrollHeight;
        if (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
    }

    function setState(s) {
        arc.className = 'arc ' + s;
        const map = { idle: 'LISTENING', speaking: 'SPEAKING...', error: 'SYSTEM ERROR' };
        status.textContent = map[s] || 'ONLINE';
    }

    // ── Boot Sequence ──
    document.getElementById('boot-btn').addEventListener('click', async () => {
        const key = document.getElementById('api-input').value.trim();
        if (!key) { log('ERROR: API Key required.', 'err'); return; }
        
        localStorage.setItem('jarvis_key', key);
        document.getElementById('boot').classList.add('hidden');
        
        log('Requesting microphone access...', 'sys');
        try {
            // AudioContexts MUST be created inside a user click event
            micCtx = new AudioContext({ sampleRate: 16000 });
            playCtx = new AudioContext({ sampleRate: 24000 });
            await micCtx.resume();
            await playCtx.resume();

            micStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true } 
            });
            log('Audio systems online. Connecting to Gemini...', 'ok');
            startMic();
            connectWS(key);
        } catch (e) {
            log(`CRITICAL: ${e.message}`, 'err');
            setState('error');
        }
    });

    // Auto-fill saved key
    window.addEventListener('load', () => {
        const k = localStorage.getItem('jarvis_key');
        if (k) document.getElementById('api-input').value = k;
    });

    // ── Microphone Capture ──
    function startMic() {
        const source = micCtx.createMediaStreamSource(micStream);
        micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
        
        micProcessor.onaudioprocess = (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN || isPlaying) return;
            
            const input = e.inputBuffer.getChannelData(0);
            const pcm16 = float32ToInt16(input);
            const base64 = arrayBufferToBase64(pcm16.buffer);
            
            ws.send(JSON.stringify({
                realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64 }] }
            }));
        };
        
        source.connect(micProcessor);
        micProcessor.connect(micCtx.destination);
    }

    // ── WebSocket Connection ──
    function connectWS(key) {
        ws = new WebSocket(`${WS_URL}?key=${key}`);
        
        ws.onopen = () => {
            log('WebSocket OPEN. Sending configuration...', 'sys');
            const voice = localStorage.getItem('jarvis_voice') || 'Charon';
            
            ws.send(JSON.stringify({
                setup: {
                    model: MODEL,
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    },
                    systemInstruction: { 
                        parts: [{ text: "You are JARVIS, Tony Stark's AI. Be concise. Address user as 'Sir'." }] 
                    }
                }
            }));
        };

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            
            if (msg.setupComplete) {
                log('✅ SETUP COMPLETE. JARVIS IS ONLINE.', 'ok');
                setState('idle');
            }
            
            if (msg.serverContent) {
                const sc = msg.serverContent;
                
                // Play Audio
                if (sc.modelTurn && sc.modelTurn.parts) {
                    for (const part of sc.modelTurn.parts) {
                        if (part.inlineData && part.inlineData.data) {
                            playAudio(part.inlineData.data);
                        }
                    }
                }
                
                // Transcriptions
                if (sc.inputTranscription && sc.inputTranscription.text) {
                    log(`You: ${sc.inputTranscription.text}`, 'user');
                }
                if (sc.outputTranscription && sc.outputTranscription.text) {
                    log(`JARVIS: ${sc.outputTranscription.text}`, 'ai');
                }
            }
        };

        ws.onerror = () => {
            log('WEBSOCKET ERROR: Check API Key or Network.', 'err');
            setState('error');
        };

        ws.onclose = (e) => {
            log(`Connection closed (Code: ${e.code}) Reason: ${e.reason}`, 'err');
            setState('error');
        };
    }

    // ── Audio Playback ──
    function playAudio(base64) {
        setState('speaking');
        isPlaying = true;
        
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        
        const pcm16 = new Int16Array(bytes.buffer);
        const float32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768.0;
        
        const buffer = playCtx.createBuffer(1, float32.length, 24000);
        buffer.getChannelData(0).set(float32);
        
        const source = playCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(playCtx.destination);
        
        // Schedule seamless playback
        const now = playCtx.currentTime;
        if (nextStartTime < now) nextStartTime = now + 0.05;
        source.start(nextStartTime);
        nextStartTime += buffer.duration;
        
        // Reset idle state when audio finishes
        clearTimeout(speakingTimeout);
        speakingTimeout = setTimeout(() => {
            isPlaying = false;
            nextStartTime = 0;
            setState('idle');
        }, (buffer.duration * 1000) + 100);
    }

    // ── Utilities ──
    function float32ToInt16(f32) {
        const pcm = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) {
            const s = Math.max(-1, Math.min(1, f32[i]));
            pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return pcm;
    }

    function arrayBufferToBase64(buf) {
        const bytes = new Uint8Array(buf);
        let binary = '';
        for (let i = 0; i < bytes.length; i += 8192) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, bytes.length)));
        }
        return btoa(binary);
    }

    // ── Settings ──
    function openSettings() {
        document.getElementById('s-key').value = localStorage.getItem('jarvis_key') || '';
        document.getElementById('s-voice').value = localStorage.getItem('jarvis_voice') || 'Charon';
        document.getElementById('settings-modal').classList.remove('hidden');
    }
    function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
    function saveSettings() {
        const k = document.getElementById('s-key').value.trim();
        const v = document.getElementById('s-voice').value;
        if (k) localStorage.setItem('jarvis_key', k);
        localStorage.setItem('jarvis_voice', v);
        closeSettings();
        if (ws) { ws.close(); setTimeout(() => connectWS(localStorage.getItem('jarvis_key')), 500); }
        log('Settings saved. Reconnecting...', 'sys');
    }
</script>
</body>
</html>
