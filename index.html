<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Zero-Install Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mainframe">
        <header>
            <h1>J.A.R.V.I.S. <span class="sub">ZERO-INSTALL CORE</span></h1>
            <div class="stats">
                <span>Graph Nodes: <b id="node-count">0</b></span>
                <span>Status: <b id="status" class="online">ONLINE</b></span>
            </div>
        </header>

        <div class="sensors">
            <div class="vision-module">
                <video id="screen-feed" autoplay playsinline muted></video>
                <div class="overlay" id="vision-status">VISION OFFLINE</div>
                <button id="screen-btn" class="vision-btn">Share Screen</button>
            </div>
            
            <div class="audio-module">
                <button id="mic-btn">🎤 Activate Audio</button>
                <div class="waveform"></div>
            </div>
        </div>

        <div class="console" id="terminal"></div>
        
        <div class="input-row">
            <input type="text" id="cmd-input" placeholder="Enter command..." autocomplete="off" />
        </div>
    </div>
    <script src="jarvis_brain.js"></script>
    <script src="script.js"></script>
</body>
</html>
