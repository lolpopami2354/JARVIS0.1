<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // STARK INDUSTRIES</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --blue: #0055ff;
            --dark: #050505;
            --grid: rgba(0, 243, 255, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark);
            background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Boot */
        #boot {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
        #boot.hidden { display: none; }
        #boot h1 { font-size: 2.5rem; text-shadow: 0 0 20px var(--cyan); margin-bottom: 15px; letter-spacing: 5px; }
        #boot p { font-family: 'Share Tech Mono', monospace; color: #666; margin-bottom: 25px; font-size: 0.85rem; }
        .input { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 14px 20px; font-family: 'Share Tech Mono', monospace; font-size: 1rem; width: 380px; text-align: center; outline: none; margin-bottom: 15px; }
        .btn { background: var(--cyan); color: #000; border: none; padding: 14px 50px; font-family: 'Orbitron'; font-weight: bold; font-size: 1rem; cursor: pointer; clip-path: polygon(10% 0,100% 0,90% 100%,0 100%); transition: 0.3s; letter-spacing: 2px; }
        .btn:hover { background: #fff; box-shadow: 0 0 30px var(--cyan); }

        /* HUD */
        .hud-top { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 0.7rem; letter-spacing: 4px; opacity: 0.6; }
        .arc-wrap { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .arc { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--cyan) 30%, transparent 70%); box-shadow: 0 0 60px var(--cyan), 0 0 120px var(--blue); transition: all 0.3s; }
        .ring { position: absolute; border: 2px solid var(--cyan); border-radius: 50%; opacity: 0.25; }
        .r1 { width: 210px; height: 210px; animation: spin 8s linear infinite; border-style: dashed; }
        .r2 { width: 270px; height: 270px; animation: spinr 12s linear infinite; }
        .arc.listening { background: radial-gradient(circle, #fff 0%, #00ff88 30%, transparent 70%); box-shadow: 0 0 60px #00ff88; }
        .arc.speaking { background: radial-gradient(circle, #fff 0%, var(--cyan) 30%, transparent 70%); box-shadow: 0 0 100px var(--cyan); transform: scale(1.15); }
        .arc.thinking { background: radial-gradient(circle, #fff 0%, #ffaa00 30%, transparent 70%); box-shadow: 0 0 60px #ffaa00; animation: pulse 0.3s infinite alternate; }
        .arc.error { background: radial-gradient(circle, #fff 0%, #ff3333 30%, transparent 70%); box-shadow: 0 0 60px #ff3333; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spinr { to { transform: rotate(-360deg); } }
        @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        #status { position: absolute; bottom: 250px; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; }

        /* Log */
        #log {
            position: absolute; bottom: 15px; width: 85%; max-width: 900px; height: 200px;
            background: rgba(0,15,30,0.8); border: 1px solid rgba(0,243,255,0.3); border-radius: 8px;
            padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem;
            overflow-y: auto; line-height: 1.5;
        }
        .l-sys { color: #ffaa00; }
        .l-err { color: #ff4444; font-weight: bold; }
        .l-ok { color: #00ff88; }
        .l-user { color: #fff; }
        .l-ai { color: var(--cyan); }

        /* Debug */
        #debug-dot { position: absolute; top: 25px; left: 25px; width: 12px; height: 12px; border-radius: 50%; background: #ff4444; transition: 0.3s; }
        #debug-dot.on { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
        #debug-dot.warn { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; }

        /* Settings */
        #settings-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; transition: 0.3s; z-index: 100; }
        #settings-btn:hover { background: var(--cyan); color: #000; transform: rotate(90deg); }
        #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 5000; backdrop-filter: blur(8px); }
        #settings-modal.hidden { display: none; }
        .s-panel { background: rgba(5,15,30,0.98); border: 1px solid var(--cyan); padding: 35px; width: 420px; }
        .s-panel h2 { margin-bottom: 20px; border-bottom: 1px solid var(--cyan); padding-bottom: 10px; font-size: 1rem; letter-spacing: 3px; }
        .s-group { margin-bottom: 18px; }
        .s-group label { display: block; font-family: 'Share Tech Mono'; font-size: 0.7rem; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 2px; }
        .s-group input, .s-group select { width: 100%; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.3); color: var(--cyan); padding: 10px; font-family: 'Share Tech Mono'; font-size: 0.9rem; outline: none; }
        .s-group select option { background: #050505; }
        .s-actions { display: flex; gap: 12px; margin-top: 25px; }
        .s-btn { flex: 1; padding: 12px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; font-size: 0.8rem; }
        .s-save { background: var(--cyan); color: #000; }
        .s-cancel { background: transparent; border: 1px solid #ff4444; color: #ff4444; }
    </style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
    <h1>J.A.R.V.I.S.</h1>
    <p>ENTER API KEY → CLICK INITIALIZE → ALLOW MICROPHONE</p>
    <input type="password" class="input" id="api-input" placeholder="GEMINI API KEY">
    <button class="btn" id="boot-btn">⚡ INITIALIZE</button>
</div>

<!-- HUD -->
<div id="debug-dot"></div>
<div class="hud-top">STARK INDUSTRIES // JARVIS WEB PROTOCOL</div>
<button id="settings-btn" onclick="openSettings()">⚙️</button>

<div class="arc-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div id="arc" class="arc"></div>
</div>
<div id="status">OFFLINE</div>
<div id="log"></div>

<!-- SETTINGS -->
<div id="settings-modal" class="hidden">
    <div class="s-panel">
        <h2>CONFIG</h2>
        <div class="s-group"><label>API Key</label><input type="password" id="s-key"></div>
        <div class="s-group"><label>Voice</label>
            <select id="s-voice">
                <option value="Charon">Charon (Deep)</option>
                <option value="Aoede">Aoede (Warm)</option>
                <option value="Puck">Puck (Bright)</option>
                <option value="Kore">Kore (Firm)</option>
                <option value="Fenrir">Fenrir (Gruff)</option>
            </select>
        </div>
        <div class="s-group"><label>Model</label>
            <select id="s-model">
                <option value="models/gemini-2.0-flash-live-001">gemini-2.0-flash-live-001</option>
                <option value="models/gemini-2.5-flash-preview-native-audio-dialog">gemini-2.5-flash-preview-native-audio-dialog</option>
            </select>
        </div>
        <div class="s-actions">
            <button class="s-btn s-save" onclick="saveSettings()">SAVE</button>
            <button class="s-btn s-cancel" onclick="closeSettings()">CANCEL</button>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// J.A.R.V.I.S. WEB CORE — DIAGNOSTIC BUILD
// ═══════════════════════════════════════════════════════════════

const WS_BASE = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";

let ws = null;
let micCtx = null;
let playCtx = null;
let micStream = null;
let isPlaying = false;
let currentModel = localStorage.getItem('jarvis_model') || 'models/gemini-2.0-flash-live-001';

const arc = document.getElementById('arc');
const status = document.getElementById('status');
const logEl = document.getElementById('log');
const dot = document.getElementById('debug-dot');

// ── Logging ──
function log(msg, type = 'sys') {
    const d = document.createElement('div');
    d.className = `l-${type}`;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(`[JARVIS:${type}]`, msg);
}

function setState(s) {
    arc.className = 'arc ' + s;
    const map = { idle: 'LISTENING', listening: 'HEARING...', thinking: 'PROCESSING...', speaking: 'SPEAKING...', error: 'ERROR' };
    status.textContent = map[s] || 'ONLINE';
}

// ── Boot ──
document.getElementById('boot-btn').addEventListener('click', async () => {
    const key = document.getElementById('api-input').value.trim();
    if (!key) { log('ERROR: No API key entered.', 'err'); return; }
    
    localStorage.setItem('jarvis_key', key);
    document.getElementById('boot').classList.add('hidden');
    
    log('Step 1: Creating AudioContexts...', 'sys');
    try {
        micCtx = new AudioContext({ sampleRate: 16000 });
        playCtx = new AudioContext({ sampleRate: 24000 });
        await micCtx.resume();
        await playCtx.resume();
        log(`Step 1 OK: mic=${micCtx.state}, play=${playCtx.state}`, 'ok');
    } catch (e) {
        log(`Step 1 FAILED: ${e.message}`, 'err');
        setState('error');
        return;
    }

    log('Step 2: Requesting microphone...', 'sys');
    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });
        log('Step 2 OK: Microphone access granted.', 'ok');
    } catch (e) {
        log(`Step 2 FAILED: ${e.message}`, 'err');
        setState('error');
        return;
    }

    log('Step 3: Connecting WebSocket...', 'sys');
    connect(key);
    startMic();
});

// Auto-fill
window.addEventListener('load', () => {
    const k = localStorage.getItem('jarvis_key');
    if (k) document.getElementById('api-input').value = k;
});

// ── WebSocket ──
function connect(apiKey) {
    const url = `${WS_BASE}?key=${apiKey}`;
    log(`Connecting to: ${url.substring(0, 80)}...`, 'sys');
    log(`Model: ${currentModel}`, 'sys');
    
    dot.className = '';
    
    try {
        ws = new WebSocket(url);
    } catch (e) {
        log(`WebSocket creation failed: ${e.message}`, 'err');
        setState('error');
        return;
    }

    ws.onopen = () => {
        log('Step 3 OK: WebSocket OPEN. Sending setup...', 'ok');
        dot.className = 'warn';
        
        const voice = localStorage.getItem('jarvis_voice') || 'Charon';
        
        const setupMsg = {
            setup: {
                model: currentModel,
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: voice }
                        }
                    }
                },
                systemInstruction: {
                    parts: [{ text: "You are JARVIS, Tony Stark's AI. Be concise. Address user as 'Sir'. Keep responses to 1-2 sentences." }]
                }
            }
        };
        
        log(`Setup payload: ${JSON.stringify(setupMsg).substring(0, 200)}...`, 'sys');
        ws.send(JSON.stringify(setupMsg));
    };

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            handleMessage(data);
        } catch (e) {
            log(`Parse error: ${e.message}`, 'err');
        }
    };

    ws.onerror = (e) => {
        log(`WEBSOCKET ERROR: ${e.type || 'Unknown'}`, 'err');
        log('Possible causes: Invalid API key, model not available, or Live API not enabled.', 'err');
        dot.className = '';
        setState('error');
    };

    ws.onclose = (e) => {
        log(`WebSocket CLOSED: code=${e.code}, reason=${e.reason || 'none'}`, 'err');
        dot.className = '';
        setState('error');
        
        // Specific close codes
        if (e.code === 1006) log('Code 1006: Connection failed. Check API key & network.', 'err');
        if (e.code === 1008) log('Code 1008: Policy violation. API key may be invalid.', 'err');
        if (e.code === 1011) log('Code 1011: Server error. Model may be unavailable.', 'err');
    };
}

// ── Message Handler ──
function handleMessage(data) {
    // Setup complete
    if (data.setupComplete) {
        log('✅ SETUP COMPLETE — JARVIS IS ONLINE!', 'ok');
        dot.className = 'on';
        setState('idle');
        return;
    }

    // Setup error
    if (data.error) {
        log(`❌ API ERROR: ${JSON.stringify(data.error)}`, 'err');
        setState('error');
        return;
    }

    // Server content
    if (data.serverContent) {
        const sc = data.serverContent;
        
        // Audio output
        if (sc.modelTurn && sc.modelTurn.parts) {
            for (const part of sc.modelTurn.parts) {
                if (part.inlineData && part.inlineData.data) {
                    playAudio(part.inlineData.data);
                }
                if (part.text) {
                    log(`JARVIS: ${part.text}`, 'ai');
                }
            }
        }

        // Input transcription (what you said)
        if (sc.inputTranscription && sc.inputTranscription.text) {
            log(`You: ${sc.inputTranscription.text}`, 'user');
        }

        // Output transcription (what JARVIS said)
        if (sc.outputTranscription && sc.outputTranscription.text) {
            // Already logged via text parts
        }

        // Turn complete
        if (sc.turnComplete) {
            setState('idle');
        }
    }

    // Tool calls
    if (data.toolCall) {
        setState('thinking');
        log('Tool call received (web version: acknowledging)', 'sys');
        if (ws && ws.readyState === WebSocket.OPEN) {
            const calls = data.toolCall.functionCalls || [];
            const responses = calls.map(fc => ({
                id: fc.id || 'unknown',
                name: fc.name || 'unknown',
                response: { result: 'Web version - tool not available locally' }
            }));
            ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
        }
    }
}

// ── Mic Capture ──
function startMic() {
    log('Step 4: Starting microphone capture...', 'sys');
    const source = micCtx.createMediaStreamSource(micStream);
    const processor = micCtx.createScriptProcessor(4096, 1, 1);
    
    processor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (isPlaying) return;
        
        const input = e.inputBuffer.getChannelData(0);
        
        // Silence detection
        let hasAudio = false;
        for (let i = 0; i < input.length; i += 50) {
            if (Math.abs(input[i]) > 0.015) { hasAudio = true; break; }
        }
        
        if (hasAudio) {
            setState('listening');
            const pcm = float32ToPcm16(input);
            const b64 = bufferToBase64(pcm);
            ws.send(JSON.stringify({
                realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: b64 }] }
            }));
        }
    };
    
    source.connect(processor);
    processor.connect(micCtx.destination);
    log('Step 4 OK: Mic capture active. Speak now.', 'ok');
}

// ── Audio Playback ──
function playAudio(base64Data) {
    setState('speaking');
    isPlaying = true;
    
    try {
        const binary = atob(base64Data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        
        const pcm16 = new Int16Array(bytes.buffer);
        const float32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768.0;
        
        const buffer = playCtx.createBuffer(1, float32.length, 24000);
        buffer.getChannelData(0).set(float32);
        
        const src = playCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(playCtx.destination);
        src.onended = () => { setTimeout(() => { isPlaying = false; setState('idle'); }, 100); };
        src.start(0);
    } catch (e) {
        log(`Playback error: ${e.message}`, 'err');
        isPlaying = false;
    }
}

// ── Utilities ──
function float32ToPcm16(f32) {
    const pcm = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
        const s = Math.max(-1, Math.min(1, f32[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return pcm.buffer;
}

function bufferToBase64(buf) {
    const bytes = new Uint8Array(buf);
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, bytes.length)));
    }
    return btoa(binary);
}

// ── Settings ──
function openSettings() {
    document.getElementById('s-key').value = localStorage.getItem('jarvis_key') || '';
    document.getElementById('s-voice').value = localStorage.getItem('jarvis_voice') || 'Charon';
    document.getElementById('s-model').value = currentModel;
    document.getElementById('settings-modal').classList.remove('hidden');
}
function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
function saveSettings() {
    const k = document.getElementById('s-key').value.trim();
    const v = document.getElementById('s-voice').value;
    const m = document.getElementById('s-model').value;
    if (k) localStorage.setItem('jarvis_key', k);
    localStorage.setItem('jarvis_voice', v);
    localStorage.setItem('jarvis_model', m);
    currentModel = m;
    closeSettings();
    if (ws) { ws.close(); setTimeout(() => connect(localStorage.getItem('jarvis_key')), 500); }
    log('Settings saved. Reconnecting...', 'sys');
}
</script>
</body>
</html>
