<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. v0.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud">
        <h1>J.A.R.V.I.S. <span class="version">v0.1</span></h1>
        <div class="terminal" id="terminal">
            <div class="log">[SYSTEM] Booting up...</div>
            <div class="log">[SYSTEM] Awaiting voice input...</div>
        </div>
        <button id="mic-btn">🎤 Activate Mic</button>
        <div class="input-row">
            <input type="text" id="text-input" placeholder="Type a command..." />
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
